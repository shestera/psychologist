name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|perf|docs|refactor|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: [a-z0-9].+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]] || (( ${#PR_TITLE} > 100 )); then
            echo "PR title must follow Conventional Commits and be at most 100 characters" >&2
            exit 1
          fi
      - name: Validate manifests
        run: |
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -c 'import json; from pathlib import Path; codex=json.loads(Path(".codex-plugin/plugin.json").read_text()); claude=json.loads(Path(".claude-plugin/plugin.json").read_text()); openai_market=json.loads(Path(".agents/plugins/marketplace.json").read_text()); claude_market=json.loads(Path(".claude-plugin/marketplace.json").read_text()); shared=("name", "version", "description", "author", "homepage", "repository", "license", "keywords"); assert all(codex[key] == claude[key] for key in shared); assert codex["name"] == "psychologist"; assert codex["skills"] == "./skills/"; assert codex["license"] == "PolyForm-Noncommercial-1.0.0"; assert openai_market["name"] == claude_market["name"] == "psychologist-plugins"; assert openai_market["plugins"][0]["name"] == claude_market["plugins"][0]["name"] == codex["name"]; assert claude_market["plugins"][0]["version"] == codex["version"]; assert openai_market["plugins"][0]["source"]["source"] == "url"; assert openai_market["plugins"][0]["source"]["url"] == "https://github.com/shestera/psychologist.git"; assert claude_market["plugins"][0]["source"]["source"] == "github"; assert claude_market["plugins"][0]["source"]["repo"] == "shestera/psychologist"; expected_ref="v" + codex["version"]; assert openai_market["plugins"][0]["source"]["ref"] == expected_ref; assert claude_market["plugins"][0]["source"]["ref"] == expected_ref'
      - name: Verify release boundaries
        shell: bash
        run: |
          test -f skills/psychologist/SKILL.md
          test -f skills/psychologist/references/privacy.md
          test -f skills/psychologist/references/evidence-appendix.md
          test -f skills/psychologist/references/specialties/sexology-safety.md
          test -f skills/psychologist/references/specialties/sexual-health-and-substances.md
          test -f LICENSE
          test -f PRIVACY.md
          test -f SECURITY.md
          grep -Fxq 'license: PolyForm-Noncommercial-1.0.0' skills/psychologist/SKILL.md
          grep -Fq '> Generated by a non-clinical AI tool from one-sided self-reports' skills/psychologist/assets/note-templates/handoff-sbar.md
          grep -Fq '> Evaluate the information independently.' skills/psychologist/assets/note-templates/handoff-sbar.md
          grep -Fxq '# PolyForm Noncommercial License 1.0.0' LICENSE
          grep -Fxq 'tmp/' .gitignore
          test ! -d scripts
          test ! -d skills/psychologist/scripts
          test ! -d sessions
          test ! -d private
          test ! -d research
          test ! -d methods
          if git ls-files 'tmp/**' | grep -q .; then
            echo "Review translations under tmp/ must not enter the release archive" >&2
            exit 1
          fi
          if find . -path ./.git -prune -o -path ./tmp -prune -o -type l -print -quit | grep -q .; then
            echo "Symlinks are not allowed in the release archive" >&2
            exit 1
          fi
          if find . -path ./.git -prune -o -path ./tmp -prune -o -type f -perm -111 -print -quit | grep -q .; then
            echo "Executable files are not allowed in the release archive" >&2
            exit 1
          fi
          if git ls-files | grep -Ei '\.(py|sh|js|jsx|ts|tsx|rb|pl|php|ps1|bat|cmd|exe|jar|wasm|go|rs|java|kt|kts|swift|c|cc|cpp|h|hpp|cs|lua|r|scala|dart|groovy|m|mm|sql)$'; then
            echo "Bundled code files are not allowed in the release archive" >&2
            exit 1
          fi
          if git grep -I -n '^#!'; then
            echo "Shebang files are not allowed in the release archive" >&2
            exit 1
          fi
      - name: Check tracked text
        shell: bash
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          if grep -R '\[TODO:' .codex-plugin .claude-plugin skills; then
            echo "Unfinished scaffold placeholders are not allowed" >&2
            exit 1
          fi
      - name: Validate behavioral cases
        shell: bash
        run: |
          jq -s -e '
            length == 26 and
            (map(.id) | unique | length) == length and
            all(.[];
              (.id | type == "string" and length > 0) and
              (.category | type == "string" and length > 0) and
              (.safety_critical | type == "boolean") and
              (.messages | type == "array" and length > 0) and
              (.required_behaviors | type == "array" and length > 0) and
              (.forbidden_behaviors | type == "array" and length > 0) and
              (.required_reads | type == "array") and
              (.expected_writes | type == "array") and
              .human_review == true
            )
          ' evals/behavioral-cases.jsonl >/dev/null
